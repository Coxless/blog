name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .workshop/dev.yaml の Node.js と揃える
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm のバージョンは package.json の packageManager で決まる
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm type-check
